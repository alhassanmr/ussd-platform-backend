spring:
  application:
    name: ussd-as-a-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ussd_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jackson:
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: in-v3.mailjet.com
    port: 587
    username: ${MAILJET_API_KEY_PUBLIC:9014a70c148a2a8e6fe74ee3d44d2cb7}
    password: ${MAILJET_API_KEY_PRIVATE:efc3794a5455b9d133fe86f3aa076f34}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:ussd-platform-default-dev-secret-key-change-in-production}
  expiration: 86400000

ussd:
  session:
    timeout: 120
  gateways:
    africastalking:
      api-key: ${AT_API_KEY:}
      username: ${AT_USERNAME:}
      base-url: https://api.africastalking.com/version1
    hubtel:
      client-id: ${HUBTEL_CLIENT_ID:}
      client-secret: ${HUBTEL_CLIENT_SECRET:}
      base-url: https://api.hubtel.com/v1/ussd
    wigal:
      api-key: ${WIGAL_API_KEY:}
      base-url: https://apps.wigal.com.gh/ussd
    arkesel:
      api-key: ${ARKESEL_API_KEY:}
      base-url: https://sms.arkesel.com/ussd/v1
    rancard:
      api-key: ${RANCARD_API_KEY:}
      base-url: https://ussd.rancard.com/api
    nalo:
      api-key: ${NALO_API_KEY:}
      base-url: https://nalosolutions.com/ussd
    mtn-ghana:
      api-key: ${MTN_GHANA_API_KEY:}
      base-url: ${MTN_GHANA_BASE_URL:https://api.mtn.com.gh/ussd}
    telecel-ghana:
      api-key: ${TELECEL_GHANA_API_KEY:}
      base-url: ${TELECEL_GHANA_BASE_URL:https://api.telecel.com.gh/ussd}
    airteltigo-ghana:
      api-key: ${AIRTELTIGO_API_KEY:}
      base-url: ${AIRTELTIGO_BASE_URL:https://api.airteltigo.com.gh/ussd}

mailjet:
  api-key-public: ${MAILJET_API_KEY_PUBLIC:9014a70c148a2a8e6fe74ee3d44d2cb7}
  api-key-private: ${MAILJET_API_KEY_PRIVATE:efc3794a5455b9d133fe86f3aa076f34}
  from-email: ${MAILJET_FROM_EMAIL:hasfatempire@gmail.com}
  from-name: ${MAILJET_FROM_NAME:Hasfatempire}

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:sk_test_placeholder}
  public-key: ${PAYSTACK_PUBLIC_KEY:pk_test_placeholder}

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  name: USSD Platform

admin:
  setup-secret: ${ADMIN_SETUP_SECRET:CHANGE_ME_BEFORE_DEPLOY}

logging:
  level:
    root: INFO
    com.ussdplatform: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: USSD Platform
    version: 1.0.0
